@if (customerList.length > 0) {
<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <h1 class="display-6">CLIENTI</h1>
    </div>
  </div>
  <div class="input-group mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Ricerca cliente"
      aria-label="Ricerca film per titolo"
      aria-describedby="button-search"
    />
    <button class="btn btn-success" type="button" id="button-search">
      Cerca
    </button>
  </div>
  <table class="table table-success table-hover">
    <thead>
      <tr>
        <th scope="col"><i class="fas fa-images text-secondary-emphasis"></i></th>
        <th scope="col"><i class="fas fa-id-badge me-2 text-secondary-emphasis"></i>Codice</th>
        <th scope="col"><i class="fas fa-signature me-2 text-secondary-emphasis"></i>Nome</th>
        <th scope="col"><i class="fas fa-map me-2 text-secondary-emphasis"></i>Indirizzo</th>
        <th scope="col"><i class="fas fa-envelope me-2 text-secondary-emphasis"></i>E-mail</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customerList" [routerLink]="'/customers/' + c.id">
        <td  class="table-light">
          <img
            [src]="imgUrl + c.image"
            class="rounded-circle me-3"
            alt="{{ c.name }}"
            width="50"
            height="50"
          />
        </td>
        <td class="table-light">
          {{ c.id }}
        </td>
        <td class="table-light">
          <h5>{{ c.name }}</h5>
        </td>
        <td class="table-light">
          {{ c.address }}
        </td>
        <td class="table-light">
          <p class="mb-1">
               {{ c.email }}
            </p>
        </td>
      </tr>
    </tbody>
  </table>
</div>
} @else {
<div class="message message-alert">Clienti non disponibili</div>
}
