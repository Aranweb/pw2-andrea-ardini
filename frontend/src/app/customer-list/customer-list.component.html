@if (customerList.length > 0) {
<div class="container mt-4">
  <div class="row">
    <div class="col-11">
      <h1 class="display-6 text-success">CLIENTI</h1>
    </div>
    <div class="col-1">
      <button class="btn btn-success" type="button" id="button-search" (click)="newCustomer()">
        Nuovo
      </button>
    </div>
  </div>
  <!-- <div class="input-group mb-3">
    <input type="text" class="form-control" placeholder="Ricerca cliente" aria-label="Ricerca film per titolo"
      aria-describedby="button-search" />
    <button class="btn btn-success" type="button" id="button-search">
      Cerca
    </button>
  </div> -->
  <table class="table table-success table-hover">
    <thead>
      <tr>
        <th calss="col-1"><i class="fas fa-images text-secondary-emphasis"></i></th>
        <th calss="col-1"><i class="fas fa-id-badge me-2 text-secondary-emphasis"></i>ID</th>
        <th class="col-4"><i class="fas fa-signature me-2 text-secondary-emphasis"></i>Nome</th>
        <th class="col-4"><i class="fas fa-envelope me-2 text-secondary-emphasis"></i>E-mail</th>
        <th class="col-2"><i class="fas fa-pen-to-square me-2 text-secondary-emphasis"></i>Azioni</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customerList" (click)="showCustomerDetail(c)" class=" table-light align-middle"
        style="cursor: pointer;">
        <td>
          <img [src]="imgUrl + c.image" class="rounded-circle me-3" alt="{{ c.name }}" width="50" height="50" />
        </td>
        <td>
          {{ c.id }}
        </td>
        <td>
          <strong>
            {{ c.name }}
          </strong>
        </td>
        <td>
          <p class="mb-1">
            {{ c.email }}
          </p>
        </td>
        <td class="text-center">
          <span class="icon-wrapper" (click)="editCustomer(c, $event)" title="Modifica cliente">
            <i class="fas fa-pen text-primary-emphasis"></i>
          </span>
          <span class="icon-wrapper" (click)="deleteCustomer(c, $event)" title="Elimina cliente">
            <i class="fas fa-trash-can text-danger"></i>
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
} @else {
<div class="message message-alert">Clienti non disponibili</div>
}
