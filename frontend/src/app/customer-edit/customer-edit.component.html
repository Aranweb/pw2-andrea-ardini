<div class="container">
  <div class="sticky-top bg-white pt-2">
    <div class="d-flex justify-content-between align-items-center">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item">
            <a routerLink="/" class="text-decoration-none text-success-emphasis fs-2">CLIENTI</a>
          </li>
          <li class="breadcrumb-item active text-success fs-2" aria-current="page" *ngIf="!isEditMode">
            Nuovo
          </li>
          <li class="breadcrumb-item active text-success fs-2" aria-current="page" *ngIf="isEditMode">
            Modifica
          </li>
        </ol>
      </nav>
      <div>
        <button type="submit" form="customer-form" class="btn btn-success">
          <i class="fas fa-check me-2"></i>Salva
        </button>
        <a routerLink="" class="btn btn-danger ms-2">
          <i class="fas fa-right-from-bracket me-2"></i>Annulla
        </a>
      </div>
    </div>
  </div>

  <section class="mt-4">

    @if (customer){
    <h2 class="h4 bg-success text-white text-center p-2 rounded-top mb-0" *ngIf="isEditMode">
      {{ customer.name }}
    </h2>
    <h2 class="h4 bg-success text-white text-center p-2 rounded-top mb-0" *ngIf="!isEditMode">
      Nuovo Cliente
    </h2>
    <div class="card shadow-sm">

      <div class="card-body">
        <form id="customer-form" (ngSubmit)="saveCustomer()">
          <div class="row">
            <div class="col text-center">
              <img *ngIf="isEditMode && customer.image" [src]="customerService.storageUrl + customer.image"
                class="rounded" width="150" />
              <img *ngIf="!isEditMode || !customer.image" src="placeholder-user.png" class="rounded" width="150" />
            </div>
            <div class="col d-flex flex-column justify-content-center">
              <div class="mb-3">
                <label for="image" class="form-label" *ngIf="isEditMode">Aggiorna immagine cliente</label>
                <label for="image" class="form-label" *ngIf="!isEditMode">Carica immagine cliente</label>
                <input class="form-control" type="file" id="image" (change)="onFileSelected($event)" />
              </div>
            </div>
          </div>
          <hr />
          <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="customer.name" name="name" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="customer.email" name="email" required />
          </div>
          <div class="mb-3">
            <label for="address" class="form-label">Indirizzo</label>
            <input type="text" class="form-control" id="address" [(ngModel)]="customer.address" name="address"
              required />
          </div>
          <hr />
          <div class="card-footer bg-transparent border-0 pt-2 text-end">
            
            <button type="submit" class="btn btn-success">
              <i class="fas fa-check me-2"></i>Salva
            </button>
            <a routerLink="" class="btn btn-danger ms-2">
              <i class="fas fa-right-from-bracket me-2"></i>Annulla
            </a>
          </div>
        </form>
      </div>
    </div>
    } @else {
    <div class="message message-alert">
      Creazione/modifica cliente non disponibile
    </div>
    }
  </section>
</div>
