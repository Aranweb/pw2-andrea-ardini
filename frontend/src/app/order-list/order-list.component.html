

      <table class="table table-hover">
        <thead class="rounded-top">
          <tr></tr>
          <tr>
            <th class="col-1 bg-success text-white">Numero<i class="fas fa-hashtag ms-2 text-white"></i></th>
            <th class="col-1 bg-success text-white">Data<i class="fas fa-calendar-days ms-2 text-white"></i></th>
            <th class="col-6 bg-success text-white">Descrizione<i class="fas fa-quote-left ms-2 text-white"></i></th>
            <th class="col-1 bg-success text-white">Totale<i class="fas fa-euro-sign ms-2 text-white"></i></th>
          </tr>
        </thead>
        @if (orders && orders.length > 0) {
          <tbody>
            <tr *ngFor="let o of orders" class="table-light align-middle"
            style="cursor: pointer;">
            <td>
              {{ o.order_number }}
            </td>
            <td>
              {{ o.order_data | date: 'dd/MM/yyyy' }}
            </td>
            <td>
                {{ o.description }}
            </td>
            <td>
              <p class="mb-1">
                {{ o.total | currency:'EUR' }}
              </p>
            </td>

          </tr>
        </tbody>
      } @else {
        <div class="message message-alert">Ordini non presenti</div>
      }
    </table>
