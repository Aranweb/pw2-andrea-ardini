<div *ngIf="customer" class="container">
  <div class="sticky-top bg-white pt-2">
    <div class="d-flex justify-content-between align-items-center">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item">
            <a routerLink="/" class="text-decoration-none text-success-emphasis fs-2">CLIENTI</a>
          </li>
          <li class="breadcrumb-item active text-success fs-2" aria-current="page">
            Dettaglio
          </li>
        </ol>
      </nav>
      <div>
        <a routerLink="/" class="btn btn-danger">
          <i class="fas fa-right-from-bracket me-2"></i>Esci
        </a>
      </div>
    </div>
    
    <section class="mt-4">
      <h2 class="h4 bg-success text-white text-center p-2 rounded-top mb-0">
        ANAGRAFICA
      </h2>
      
      <div class="card shadow-sm rounded-top-0">
        <div class="card-body d-flex align-items-center">
          <img *ngIf="customer.image" [src]="customerService.storageUrl + customer.image" class="rounded-circle me-4" alt="{{customer.name}}" width="150" height="150">
          <div>
            <h1 class="card-title">{{ customer.name }}</h1>
            <p class="card-text text-muted fs-5">{{ customer.email }}</p>
            <p class="card-text">{{ customer.address }}</p>
          </div>
        </div>
      </div>
    </section>
    
    <section class="mt-4">
      <h2 class="h4 bg-success text-white text-center p-2 rounded-top mb-0">
        ORDINI IN CARICO
      </h2>
      
    </section>
  </div>
  <app-order-list [orders]="customer.orders"></app-order-list>
  
</div>
